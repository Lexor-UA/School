workflows:
  flutter-build-workflow:
    name: Flutter Web, Android & iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Analyze code
        script: |
          flutter analyze
      - name: Build Web
        script: |
          flutter build web --release
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build iOS Simulator (for Appetize.io)
        script: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r app-simulator.zip Runner.app
    artifacts:
      - build/web/**
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/iphonesimulator/app-simulator.zip

  ios-testflight-workflow:
    name: iOS Release to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Admin_Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: city.swim.school
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build Flutter iOS framework
        script: flutter build ios --release --no-codesign
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build iOS (IPA)
        script: xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner"
      - name: Publish to TestFlight
        script: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          app-store-connect publish --path "$IPA_FILE"
    artifacts:
      - build/ios/ipa/*.ipa
